version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ethara-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ethara
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.local   # Local dev: bundles frontend + backend together
    container_name: ethara-app
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ethara
      - AI_API_KEY=mock-key-local
    depends_on:
      - db

volumes:
  pgdata:

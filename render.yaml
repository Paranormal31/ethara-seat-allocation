# Render Blueprint — deploy backend API + managed PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ethara-postgres
    databaseName: ethara
    user: ethara_user
    plan: free          # free tier (1 GB, 90-day expiry on free — upgrade for prod)
    region: singapore   # closest to India; change to oregon/frankfurt as needed

services:
  - type: web
    name: ethara-backend
    runtime: docker
    dockerfilePath: ./Dockerfile   # backend-only Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethara-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false          # you fill this in Render dashboard after Vercel URL is known
      - key: AI_API_KEY
        sync: false          # optional — set in Render dashboard if needed
